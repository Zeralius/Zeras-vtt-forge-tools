name: Release module

# Two ways in:
#   1. push a tag `<module-id>-v<version>` (what `npm run release` does), or
#   2. run this workflow from the Actions tab and let it do the bump, commit and tag for you.
on:
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+'
      - '*-v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      module:
        description: 'Module id (folder name under modules/)'
        required: true
        type: string
      bump:
        description: 'Version bump'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.module || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git describe` and tag checks work, and credentials kept so we can push.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump, commit and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs "${{ inputs.module }}" "${{ inputs.bump }}"

      - name: Resolve release target
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$(git describe --tags --exact-match HEAD)"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          MODULE_ID="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if [ ! -f "modules/${MODULE_ID}/module.json" ]; then
            echo "::error::Tag '${TAG}' does not correspond to a module: modules/${MODULE_ID}/module.json not found."
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "module_id=${MODULE_ID}"
            echo "version=${VERSION}"
            echo "title=$(node -p "require('./modules/${MODULE_ID}/module.json').title")"
          } >> "$GITHUB_OUTPUT"

      - name: Validate manifests
        run: node scripts/validate.mjs

      - name: Check the bundle lists every module
        run: node scripts/bundle.mjs --check

      - name: Check the manifest matches the tag
        run: |
          set -euo pipefail
          MANIFEST_VERSION="$(node -p "require('./modules/${{ steps.target.outputs.module_id }}/module.json').version")"
          if [ "$MANIFEST_VERSION" != "${{ steps.target.outputs.version }}" ]; then
            echo "::error::Tag says v${{ steps.target.outputs.version }} but modules/${{ steps.target.outputs.module_id }}/module.json says v${MANIFEST_VERSION}."
            exit 1
          fi

      - name: Package
        run: node scripts/pack.mjs "${{ steps.target.outputs.module_id }}"

      - name: Compose release notes
        run: node scripts/notes.mjs "${{ steps.target.outputs.module_id }}" "${{ steps.target.outputs.version }}" > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.target.outputs.tag }}" \
            --title "${{ steps.target.outputs.title }} ${{ steps.target.outputs.version }}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            "dist/${{ steps.target.outputs.module_id }}.zip" \
            "dist/${{ steps.target.outputs.module_id }}.module.json#module.json"
